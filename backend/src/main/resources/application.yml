spring:
  application:
    name: school-service-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_service}
    username: ${DB_USERNAME:school_service_app}
    password: ${DB_PASSWORD:change-me-strong-password}
  jpa:
    open-in-view: false
    hibernate:
      # Şema SADECE Flyway migration'ları ile kurulur; Hibernate hiçbir zaman DDL üretmez (bkz. CLAUDE.md).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    # "Beni hatırla" işaretlenmediğinde kullanılan sunucu tavanı (bkz. docs/SECURITY.md "Beni hatırla").
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:1}
    refresh-token-ttl-days-remember-me: ${JWT_REFRESH_TOKEN_TTL_DAYS_REMEMBER_ME:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@okulservisi.local}
    reset-password-base-url: ${RESET_PASSWORD_BASE_URL:http://localhost:3000/sifre-sifirla}
    registration-verification-base-url: ${REGISTRATION_VERIFICATION_BASE_URL:http://localhost:3000/e-posta-dogrula}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Sistem Yöneticisi}
  security:
    # BFF->backend server-to-server çağrılarını (şu an sadece /api/auth/social-login) doğrulayan
    # paylaşılan sır - bkz. docs/SECURITY.md "Sosyal giriş". BOŞSA bu uç nokta HER ZAMAN 401 döner
    # (fail-closed) - asla "boş header boş secret'a eşit" şeklinde bypass edilemez.
    internal-service-key: ${INTERNAL_SERVICE_KEY:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # docs/SECURITY.md: Actuator sadece health expose eder, diğer tüm endpoint'ler kapalı.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.okulservisi.backend: INFO
    # Parola/token/SQL parametre değerleri hiçbir profilde DEBUG ile açılmamalı (bkz. docs/SECURITY.md).
    org.hibernate.SQL: WARN
